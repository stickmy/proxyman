name: Release

on:
  push:
    tags: [v*.*.*]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_CODESIGN_CERTIFICATE: ${{ secrets.PROXYMAN_CODESIGN_CERTIFICATE_BASE64 != '' && secrets.PROXYMAN_CODESIGN_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/proxyman-core -> target'

      - name: Test Rust sidecar and proxy core
        run: cargo test --manifest-path crates/proxyman-core/Cargo.toml

      - name: Test SwiftUI client
        run: swift test --package-path swiftui

      - name: Import code signing certificate
        if: env.HAS_CODESIGN_CERTIFICATE == 'true'
        env:
          PROXYMAN_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.PROXYMAN_CODESIGN_CERTIFICATE_BASE64 }}
          PROXYMAN_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.PROXYMAN_CODESIGN_CERTIFICATE_PASSWORD }}
        run: bash script/import_codesign_certificate.sh

      - name: Package macOS app
        env:
          PROXYMAN_APP_VERSION: ${{ github.ref_name }}
          PROXYMAN_BUILD_NUMBER: ${{ github.run_number }}
          PROXYMAN_CODESIGN_IDENTITY: ${{ secrets.PROXYMAN_CODESIGN_IDENTITY }}
          PROXYMAN_CODESIGN_ENTITLEMENTS: ${{ vars.PROXYMAN_CODESIGN_ENTITLEMENTS }}
          PROXYMAN_NOTARIZE: ${{ secrets.PROXYMAN_NOTARIZE }}
          PROXYMAN_NOTARY_APPLE_ID: ${{ secrets.PROXYMAN_NOTARY_APPLE_ID }}
          PROXYMAN_NOTARY_TEAM_ID: ${{ secrets.PROXYMAN_NOTARY_TEAM_ID }}
          PROXYMAN_NOTARY_PASSWORD: ${{ secrets.PROXYMAN_NOTARY_PASSWORD }}
          PROXYMAN_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.PROXYMAN_NOTARY_KEYCHAIN_PROFILE }}
        run: ./script/build_and_run.sh --package

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/ProxymanClient-macos.zip
          draft: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
