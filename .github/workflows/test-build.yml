name: Test Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/proxyman-core -> target'

      - name: Test Rust sidecar and proxy core
        run: cargo test --manifest-path crates/proxyman-core/Cargo.toml

      - name: Test SwiftUI client
        run: swift test --package-path swiftui

      - name: Build SwiftUI client
        run: swift build --package-path swiftui

      - name: Build sidecar
        run: cargo build --manifest-path crates/proxyman-core/Cargo.toml --bin proxyman-sidecar
